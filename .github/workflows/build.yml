name: Build Music8481 APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Configure Bubblewrap & Fix SDK Path Bug
        run: |
          mkdir -p ~/.bubblewrap
          # Removed 'sudo' so the directories remain owned by the GitHub 'runner' user
          mkdir -p ${ANDROID_HOME}/tools
          mkdir -p ${ANDROID_HOME}/bin
          echo "{\"jdkPath\": \"${JAVA_HOME}\", \"androidSdkPath\": \"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json

      - name: Generate Android Keystore (For App Signing)
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Music8481, OU=App, O=Music8481, C=IN"

      - name: Generate Local Icon & TWA Manifest
        run: |
          sudo apt-get install -y imagemagick
          convert -size 512x512 xc:"#1DB954" icon.png
          
          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.music8481.app",
            "host": "ayushgaana.vercel.app",
            "name": "Music8481",
            "launcherName": "Music8481",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "http://localhost:8080/icon.png",
            "maskableIconUrl": "http://localhost:8080/icon.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "fallbackType": "customtabs",
            "enableNotifications": true,
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "shortcuts": []
          }
          EOF

      - name: Generate Android Project
        run: |
          python3 -m http.server 8080 &
          sleep 3
          bubblewrap update --skipVersionUpgrade

      # --- NEW STEP TO FIX GRADLE CRASHES ---
      - name: Fix Gradle Daemon & Memory Issues
        run: |
          # 1. Lower JVM Memory allocation to prevent 'Could not reserve enough space'
          sed -i 's/-Xmx1536m/-Xmx1024m/g' gradle.properties
          
          # 2. Disable Daemon and VFS watching to prevent CI timeout/crash bugs
          echo "org.gradle.daemon=false" >> gradle.properties
          echo "org.gradle.vfs.watch=false" >> gradle.properties

      - name: Build APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: password123
          BUBBLEWRAP_KEY_PASSWORD: password123
        run: bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music8481-APK
          path: app-release-signed.apk
