name: Build Web APK

# =====================================================================
#  WebView APK builder  (TV-only experience + Mobile Floating Remote)
#  - Landscape-only on all devices (TV & mobile testing)
#  - Opens BASE_URL inside the app, ALWAYS 1280px TV/desktop layout
#  - Full-screen immersive video + Widevine/cookie support
#  - Block list (Block.json) downloaded at every start + cached
#  - Android TV: Leanback launcher, real D-pad & media keys mapped to
#    spatial navigation & video controls (no on-screen remote shown)
#  - Mobile (testing): Floating draggable popup remote overlay with
#    Touch-Lock ("Touch: OFF") to simulate TV strictly
#
#  HOW TO USE:
#   1. Save as  .github/workflows/build-apk.yml
#   2. Edit the env values below (or Actions -> Run workflow)
#   3. Download the APK from the run's "Artifacts"
# =====================================================================

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base domain / initial URL (e.g. https://yourdomain.com)"
        required: false
      app_name:
        description: "App name"
        required: false
      package_name:
        description: "Package name (e.g. com.example.webapp)"
        required: false
      show_remote:
        description: "Show floating test remote on mobile phones (true/false)"
        required: false
        default: 'true'
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  BASE_URL: ${{ github.event.inputs.base_url || 'https://hotstar.com' }}
  APP_NAME: ${{ github.event.inputs.app_name || 'Veryhotstar' }}
  PACKAGE_NAME: ${{ github.event.inputs.package_name || 'com.example.webapp' }}
  SHOW_REMOTE: ${{ github.event.inputs.show_remote || 'true' }}
  BLOCK_API: 'https://raw.githubusercontent.com/Ayush8481-dev/Ayush/refs/heads/main/Block.json'
  ICON_URL: 'https://static.vecteezy.com/system/resources/previews/056/505/637/non_2x/jiohotstar-app-icon-on-transparent-background-free-png.png'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate Android WebView project
        run: |
          set -e
          mkdir -p webapp && cd webapp
          PKG_PATH=$(echo "$PACKAGE_NAME" | tr . /)
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets

          # ---------- optional icon ----------
          if [ -n "$ICON_URL" ]; then
            curl -fsSL "$ICON_URL" -o app/src/main/res/drawable/ic_launcher.png
            export ICON_REF="@drawable/ic_launcher"
          else
            export ICON_REF="@android:drawable/sym_def_app_icon"
          fi

          # ---------- settings.gradle ----------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WebApp"
          include ':app'
          EOF

          # ---------- root build.gradle ----------
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          # ---------- gradle.properties ----------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          # ---------- app/build.gradle ----------
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '__PKG__'
              compileSdk 34
              defaultConfig {
                  applicationId '__PKG__'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # ---------- AndroidManifest.xml (Landscape-only, TV + Mobile testing) ----------
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <application
                  android:label="__APP_NAME__"
                  android:icon="__ICON_REF__"
                  android:banner="__ICON_REF__"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar.Fullscreen">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:hardwareAccelerated="true"
                      android:screenOrientation="sensorLandscape"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|smallestScreenSize|screenLayout|uiMode|density|fontScale"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ---------- assets/nav.js : spatial TV D-pad navigation ----------
          cat > app/src/main/assets/nav.js <<'JSEOF'
          (function () {
            if (window.__tvnav) return;

            var cur = null;
            var SEL = 'a[href],button,input,select,textarea,summary,[tabindex]:not([tabindex="-1"]),'
                    + '[role=button],[role=link],[role=tab],[role=menuitem],[onclick],[data-focusable]';
            var STRONG = 'a[href],button,input,select,textarea,[role=button],[role=link]';
            var EDIT = /^(INPUT|TEXTAREA|SELECT)$/;

            var ring = null;
            var osd = null;
            var osdTimer = null;

            function ensureRing() {
              if (ring && document.contains(ring)) return ring;
              ring = document.createElement('div');
              ring.id = '__tv_ring';
              ring.style.cssText = 'position:fixed;pointer-events:none;z-index:2147483647;display:none;'
                + 'border:3px solid #fff;border-radius:8px;box-sizing:border-box;'
                + 'box-shadow:0 0 0 3px #1e80ff,0 0 18px rgba(30,128,255,.85);'
                + 'transition:left 80ms ease-out,top 80ms ease-out,width 80ms ease-out,height 80ms ease-out;';
              (document.body || document.documentElement).appendChild(ring);
              return ring;
            }

            function syncRing() {
              if (!cur || !document.contains(cur)) {
                if (ring) ring.style.display = 'none';
                return;
              }
              var r = cur.getBoundingClientRect();
              if (r.width < 2 || r.height < 2 || r.bottom < 0 || r.top > vh() || r.right < 0 || r.left > vw()) {
                if (ring) ring.style.display = 'none';
                return;
              }
              var el = ensureRing();
              el.style.display = 'block';
              el.style.left = Math.max(0, r.left - 3) + 'px';
              el.style.top = Math.max(0, r.top - 3) + 'px';
              el.style.width = (r.width + 6) + 'px';
              el.style.height = (r.height + 6) + 'px';
            }

            function showOsd(txt) {
              if (!osd || !document.contains(osd)) {
                osd = document.createElement('div');
                osd.style.cssText = 'position:fixed;top:24px;right:24px;z-index:2147483647;'
                  + 'background:rgba(15,17,24,.88);color:#fff;font:600 16px/1.2 sans-serif;'
                  + 'padding:10px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.25);'
                  + 'pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.45);';
                (document.body || document.documentElement).appendChild(osd);
              }
              osd.textContent = txt;
              osd.style.display = 'block';
              clearTimeout(osdTimer);
              osdTimer = setTimeout(function () { if (osd) osd.style.display = 'none'; }, 1200);
            }

            function vw() { return window.innerWidth; }
            function vh() { return window.innerHeight; }

            function cands() {
              var out = [], all = document.body ? document.body.getElementsByTagName('*') : [];
              var W = vw(), H = vh();
              for (var i = 0; i < all.length; i++) {
                var el = all[i];
                if (el === ring || el === osd) continue;
                var strong = el.matches(SEL);
                var r = el.getBoundingClientRect();
                if (r.width < 8 || r.height < 8) continue;
                if (r.bottom < -H || r.top > H * 2 || r.right < -W || r.left > W * 2) continue;
                var cs = getComputedStyle(el);
                if (cs.visibility === 'hidden' || cs.display === 'none' || cs.pointerEvents === 'none' || cs.opacity === '0') continue;
                if (el.disabled) continue;
                var ok = strong;
                if (!ok && r.width >= 20 && r.height >= 20 && cs.cursor === 'pointer') {
                  if (r.width > W * 0.9 && r.height > H * 0.85) continue;
                  var p = el.parentElement;
                  ok = !(p && getComputedStyle(p).cursor === 'pointer');
                }
                if (ok) out.push(el);
              }
              return out.filter(function (a) {
                for (var j = 0; j < out.length; j++) {
                  var b = out[j];
                  if (a === b) continue;
                  if (a.contains(b) && !a.matches(STRONG)) return false;
                  if (b.contains(a) && b.tagName === 'A' && !/^(BUTTON|INPUT|SELECT|TEXTAREA)$/.test(a.tagName)) return false;
                }
                return true;
              });
            }

            function score(c, r, d) {
              var cx = c.left + c.width / 2, cy = c.top + c.height / 2;
              var rx = r.left + r.width / 2, ry = r.top + r.height / 2;
              var p, s;
              if (d === 'left' || d === 'right') {
                var ov = Math.min(c.bottom, r.bottom) - Math.max(c.top, r.top);
                if (ov < Math.min(c.height, r.height) * 0.3) return -1;
                if (d === 'right') { if (rx <= cx + 2 || r.left < c.left + 2) return -1; p = Math.max(0, r.left - c.right); }
                else { if (rx >= cx - 2 || r.right > c.right - 2) return -1; p = Math.max(0, c.left - r.right); }
                s = Math.abs(ry - cy);
                return 1 + p + s * 3;
              }
              if (d === 'down') { if (ry <= cy + 2 || r.top < c.top + 2) return -1; p = Math.max(0, r.top - c.bottom); }
              else { if (ry >= cy - 2 || r.bottom > c.bottom - 2) return -1; p = Math.max(0, c.top - r.bottom); }
              s = Math.abs(rx - cx);
              return 1 + p + s * 2;
            }

            function fire(el, types) {
              types.forEach(function (t) {
                try { el.dispatchEvent(new MouseEvent(t, { bubbles: true, cancelable: true, view: window })); } catch (e) {}
              });
            }

            function setCur(el, d) {
              if (!el) return;
              if (cur && cur !== el) {
                fire(cur, ['mouseout', 'mouseleave']);
                if (EDIT.test(cur.tagName)) { try { cur.blur(); } catch (e) {} }
              }
              cur = el;
              fire(el, ['pointerover', 'mouseover', 'mouseenter', 'mousemove']);
              if (!EDIT.test(el.tagName)) {
                try { el.focus({ preventScroll: true }); } catch (e) {}
              }
              var vert = (d === 'up' || d === 'down');
              try {
                el.scrollIntoView({ block: vert ? 'center' : 'nearest', inline: vert ? 'nearest' : 'center', behavior: 'auto' });
              } catch (e) { el.scrollIntoView(); }
              syncRing();
              setTimeout(syncRing, 60);
              setTimeout(syncRing, 200);
            }

            function firstInView(list) {
              var best = null, bs = 1e9;
              list.forEach(function (el) {
                var r = el.getBoundingClientRect();
                if (r.bottom < 0 || r.top > vh() || r.right < 0 || r.left > vw()) return;
                var s = r.top * 2 + r.left;
                if (s < bs) { bs = s; best = el; }
              });
              return best || list[0] || null;
            }

            function scrollFor(d) {
              var ax = (d === 'left' || d === 'right');
              var sign = (d === 'right' || d === 'down') ? 1 : -1;
              var el = cur;
              while (el && el !== document.body && el !== document.documentElement) {
                var cs = getComputedStyle(el);
                if (ax) {
                  if (el.scrollWidth > el.clientWidth + 4 && /(auto|scroll)/.test(cs.overflowX)) {
                    var b = el.scrollLeft; el.scrollLeft += sign * el.clientWidth * 0.6;
                    if (el.scrollLeft !== b) return true;
                  }
                } else {
                  if (el.scrollHeight > el.clientHeight + 4 && /(auto|scroll)/.test(cs.overflowY)) {
                    var b2 = el.scrollTop; el.scrollTop += sign * el.clientHeight * 0.6;
                    if (el.scrollTop !== b2) return true;
                  }
                }
                el = el.parentElement;
              }
              var bx = window.scrollX, by = window.scrollY;
              window.scrollBy(ax ? sign * vw() * 0.5 : 0, ax ? 0 : sign * vh() * 0.6);
              return window.scrollX !== bx || window.scrollY !== by;
            }

            function move(d, retried) {
              var list = cands();
              if (!list.length) { scrollFor(d); return; }
              if (!cur || !document.contains(cur)) { setCur(firstInView(list), d); return; }
              var c = cur.getBoundingClientRect(), best = null, bs = 1e12;
              list.forEach(function (el) {
                if (el === cur) return;
                var s = score(c, el.getBoundingClientRect(), d);
                if (s >= 0 && s < bs) { bs = s; best = el; }
              });
              if (best) { setCur(best, d); return; }
              if (!retried && scrollFor(d)) {
                setTimeout(function () { move(d, true); }, 320);
              }
            }

            function ok() {
              if (!cur || !document.contains(cur)) {
                var list = cands();
                if (list.length) setCur(firstInView(list), 'down');
                return '';
              }
              if (EDIT.test(cur.tagName) && cur.tagName !== 'SELECT') {
                cur.focus();
                cur.click();
                return 'input';
              }
              fire(cur, ['pointerdown', 'mousedown', 'pointerup', 'mouseup']);
              cur.click();
              setTimeout(syncRing, 120);
              return 'ok';
            }

            window.__tvnav = function (c) {
              if (c === 'ok') return ok();
              move(c, false);
              return 'move';
            };

            window.__tvVid = function (c) {
              var vs = [].slice.call(document.querySelectorAll('video'));
              if (!vs.length) return;
              vs.sort(function (a, b) { return (b.videoWidth * b.videoHeight) - (a.videoWidth * a.videoHeight); });
              var v = vs[0];
              fire(v, ['mousemove', 'pointermove']);
              if (document.body) fire(document.body, ['mousemove', 'pointermove']);
              var dur = isFinite(v.duration) ? v.duration : 1e9;
              if (c === 'left') {
                v.currentTime = Math.max(0, v.currentTime - 10);
                showOsd('\u23EA -10s');
              } else if (c === 'right') {
                v.currentTime = Math.min(dur, v.currentTime + 10);
                showOsd('\u23E9 +10s');
              } else if (c === 'up') {
                v.volume = Math.min(1, v.volume + 0.1);
                showOsd('\uD83D\uDD0A ' + Math.round(v.volume * 100) + '%');
              } else if (c === 'down') {
                v.volume = Math.max(0, v.volume - 0.1);
                showOsd('\uD83D\uDD09 ' + Math.round(v.volume * 100) + '%');
              } else if (c === 'ok' || c === 'toggle') {
                if (v.paused) {
                  try { v.play(); } catch (e) {}
                  showOsd('\u25B6 Play');
                } else {
                  v.pause();
                  showOsd('\u23F8 Pause');
                }
              }
            };

            window.addEventListener('scroll', syncRing, true);
            window.addEventListener('resize', syncRing);
            setInterval(function () { if (cur) syncRing(); }, 180);

            window.addEventListener('touchstart', function () {
              if (cur) { cur = null; syncRing(); }
            }, { passive: true });
          })();
          JSEOF

          # ---------- MainActivity.java ----------
          cat > app/src/main/java/$PKG_PATH/MainActivity.java <<'EOF'
          package __PKG__;

          import android.app.Activity;
          import android.app.UiModeManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.ActivityInfo;
          import android.content.res.Configuration;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.drawable.ColorDrawable;
          import android.graphics.drawable.GradientDrawable;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.util.Log;
          import android.view.DisplayCutout;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.Window;
          import android.view.WindowInsets;
          import android.view.WindowManager;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.CookieManager;
          import android.webkit.PermissionRequest;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.FrameLayout;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {

              private static final String BASE_URL  = "__BASE_URL__";
              private static final String BLOCK_API = "__BLOCK_API__";
              private static final boolean SHOW_REMOTE_ON_PHONE = !"false".equalsIgnoreCase("__SHOW_REMOTE__");
              private static final String TAG = "WebApp";

              private static final String DESKTOP_UA =
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) "
                      + "Chrome/124.0.0.0 Safari/537.36";

              // 1280px TV/desktop width forced on all devices
              private static final int DESKTOP_WIDTH = 1280;

              private static final String VIEWPORT_JS =
                      "(function(){if(window.__dw)return;window.__dw=1;"
                      + "var C='width=" + DESKTOP_WIDTH + ", user-scalable=yes';"
                      + "function a(){var h=document.head||document.documentElement;if(!h)return;"
                      + "var m=document.querySelector('meta[name=viewport]');"
                      + "if(!m){m=document.createElement('meta');m.name='viewport';h.appendChild(m);}"
                      + "if(m.getAttribute('content')!==C)m.setAttribute('content',C);}"
                      + "a();new MutationObserver(a).observe(document.documentElement,"
                      + "{childList:true,subtree:true,attributes:true,attributeFilter:['content']});})();";

              private FrameLayout frame;
              private TouchGateLayout content;
              private TouchGateLayout fullscreenContainer;
              private WebView web;
              private SharedPreferences prefs;
              private final Handler handler = new Handler(Looper.getMainLooper());

              private View customView;
              private WebChromeClient.CustomViewCallback customCallback;
              private int padL, padT, padR, padB;

              private String navJs = "";
              private FrameLayout remoteOverlay;
              private LinearLayout remotePopup;
              private TextView remotePill;
              private TextView touchToggleBtn;
              private Runnable repeater;
              private boolean blockWebTouch = true;

              private final Set<String> blockDomains = Collections.synchronizedSet(new HashSet<String>());
              private final Set<String> blockUrls = Collections.synchronizedSet(new HashSet<String>());

              // Gates touches to simulate no-touchscreen TV when testing on mobile
              private class TouchGateLayout extends FrameLayout {
                  TouchGateLayout(Context c) { super(c); }
                  @Override public boolean onInterceptTouchEvent(MotionEvent ev) {
                      return !isTv() && blockWebTouch;
                  }
                  @Override public boolean onTouchEvent(MotionEvent ev) {
                      return !isTv() && blockWebTouch;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("blocklist", MODE_PRIVATE);
                  navJs = readAsset("nav.js");

                  // Strictly landscape-only
                  setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE);

                  Window w = getWindow();
                  w.setBackgroundDrawable(new ColorDrawable(Color.BLACK));
                  w.setStatusBarColor(Color.BLACK);
                  w.setNavigationBarColor(Color.BLACK);
                  if (Build.VERSION.SDK_INT >= 28) {
                      WindowManager.LayoutParams lp = w.getAttributes();
                      lp.layoutInDisplayCutoutMode = Build.VERSION.SDK_INT >= 30
                              ? WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_ALWAYS
                              : WindowManager.LayoutParams.LAYOUT_IN_DISPLAY_CUTOUT_MODE_SHORT_EDGES;
                      w.setAttributes(lp);
                  }

                  frame = new FrameLayout(this);
                  frame.setBackgroundColor(Color.BLACK);

                  content = new TouchGateLayout(this);
                  web = new WebView(this);
                  web.setBackgroundColor(Color.BLACK);
                  web.setFocusable(true);
                  web.setFocusableInTouchMode(true);
                  content.addView(web, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  fullscreenContainer = new TouchGateLayout(this);
                  fullscreenContainer.setBackgroundColor(Color.BLACK);
                  fullscreenContainer.setVisibility(View.GONE);

                  frame.addView(content, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                  frame.addView(fullscreenContainer, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));

                  // Floating popup test remote: shown ONLY on mobile / non-TV devices
                  Log.d(TAG, "isTv=" + isTv() + " showRemote=" + SHOW_REMOTE_ON_PHONE);
                  if (SHOW_REMOTE_ON_PHONE && !isTv()) {
                      View remote = buildPopupRemote();
                      frame.addView(remote);
                      remote.bringToFront();
                  }
                  setContentView(frame);

                  applyFullscreenSystemUi();

                  frame.setOnApplyWindowInsetsListener(new View.OnApplyWindowInsetsListener() {
                      @Override
                      public WindowInsets onApplyWindowInsets(View v, WindowInsets in) {
                          int l = 0, t = 0, r = 0, b = 0;
                          if (!isTv() && Build.VERSION.SDK_INT >= 28) {
                              DisplayCutout dc = in.getDisplayCutout();
                              if (dc != null) {
                                  l = dc.getSafeInsetLeft();
                                  t = dc.getSafeInsetTop();
                                  r = dc.getSafeInsetRight();
                                  b = dc.getSafeInsetBottom();
                              }
                          }
                          padL = l; padT = t; padR = r; padB = b;
                          if (customView == null) content.setPadding(l, t, r, b);
                          return in;
                      }
                  });
                  frame.requestApplyInsets();

                  CookieManager cm = CookieManager.getInstance();
                  cm.setAcceptCookie(true);
                  cm.setAcceptThirdPartyCookies(web, true);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  s.setUserAgentString(DESKTOP_UA);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);
                  s.setSupportZoom(true);
                  s.setBuiltInZoomControls(true);
                  s.setDisplayZoomControls(false);
                  s.setTextZoom(100);

                  web.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onShowCustomView(View view, CustomViewCallback callback) {
                          if (customView != null) {
                              callback.onCustomViewHidden();
                              return;
                          }
                          customView = view;
                          customCallback = callback;
                          fullscreenContainer.addView(view, new FrameLayout.LayoutParams(
                                  FrameLayout.LayoutParams.MATCH_PARENT, FrameLayout.LayoutParams.MATCH_PARENT));
                          fullscreenContainer.setVisibility(View.VISIBLE);
                          content.setVisibility(View.INVISIBLE);
                          if (remoteOverlay != null) remoteOverlay.bringToFront();
                          getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                          applyFullscreenSystemUi();
                      }

                      @Override
                      public void onHideCustomView() {
                          exitCustomView();
                      }

                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(new Runnable() {
                              @Override public void run() {
                                  String[] res = request.getResources();
                                  for (String r : res) {
                                      if (PermissionRequest.RESOURCE_PROTECTED_MEDIA_ID.equals(r)) {
                                          request.grant(new String[]{PermissionRequest.RESOURCE_PROTECTED_MEDIA_ID});
                                          return;
                                      }
                                  }
                                  request.deny();
                              }
                          });
                      }

                      @Override
                      public Bitmap getDefaultVideoPoster() {
                          return Bitmap.createBitmap(1, 1, Bitmap.Config.ARGB_8888);
                      }
                  });

                  web.setWebViewClient(new WebViewClient() {
                      private void inject(WebView view) {
                          view.evaluateJavascript(VIEWPORT_JS, null);
                          if (navJs.length() > 0) view.evaluateJavascript(navJs, null);
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          super.onPageStarted(view, url, favicon);
                          inject(view);
                      }

                      @Override
                      public void onPageCommitVisible(WebView view, String url) {
                          super.onPageCommitVisible(view, url);
                          inject(view);
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          super.onPageFinished(view, url);
                          inject(view);
                      }

                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (isBlocked(url)) {
                              Log.d(TAG, "BLOCKED: " + url);
                              return new WebResourceResponse("text/plain", "UTF-8", 403, "Blocked",
                                      new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (isBlocked(url)) {
                              Log.d(TAG, "BLOCKED NAV: " + url);
                              return true;
                          }
                          String scheme = request.getUrl().getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              return false;
                          }
                          try {
                              startActivity(new Intent(Intent.ACTION_VIEW, request.getUrl()));
                          } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  String cached = prefs.getString("json", null);
                  final boolean hadCache = cached != null && parse(cached);
                  if (hadCache) web.loadUrl(BASE_URL);

                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          String json = download(BLOCK_API);
                          if (json != null && parse(json)) {
                              prefs.edit().putString("json", json).apply();
                          }
                          if (!hadCache) {
                              runOnUiThread(new Runnable() {
                                  @Override public void run() { web.loadUrl(BASE_URL); }
                              });
                          }
                      }
                  }).start();

                  web.requestFocus();
              }

              // ---------------- TV & Floating Popup Remote Control ----------------

              private boolean isTv() {
                  UiModeManager um = (UiModeManager) getSystemService(Context.UI_MODE_SERVICE);
                  return um != null && um.getCurrentModeType() == Configuration.UI_MODE_TYPE_TELEVISION;
              }

              private int dp(int v) {
                  return Math.round(v * getResources().getDisplayMetrics().density);
              }

              private void vid(String cmd) {
                  web.evaluateJavascript("window.__tvVid&&window.__tvVid('" + cmd + "')", null);
              }

              private void press(String cmd) {
                  if ("back".equals(cmd)) { onBackPressed(); return; }
                  if ("reload".equals(cmd)) { web.reload(); return; }
                  if ("toggle".equals(cmd)) { vid("toggle"); return; }
                  if (customView != null) {
                      vid(cmd);
                  } else {
                      web.evaluateJavascript("window.__tvnav&&window.__tvnav('" + cmd + "')", new ValueCallback<String>() {
                          @Override public void onReceiveValue(String val) {
                              if ("\"input\"".equals(val)) {
                                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                                  if (imm != null) imm.showSoftInput(web, InputMethodManager.SHOW_IMPLICIT);
                              }
                          }
                      });
                  }
              }

              @Override
              public boolean dispatchKeyEvent(KeyEvent e) {
                  String cmd = null;
                  boolean isMedia = false;
                  switch (e.getKeyCode()) {
                      case KeyEvent.KEYCODE_DPAD_LEFT:  cmd = "left"; break;
                      case KeyEvent.KEYCODE_DPAD_RIGHT: cmd = "right"; break;
                      case KeyEvent.KEYCODE_DPAD_UP:    cmd = "up"; break;
                      case KeyEvent.KEYCODE_DPAD_DOWN:  cmd = "down"; break;
                      case KeyEvent.KEYCODE_DPAD_CENTER:
                      case KeyEvent.KEYCODE_ENTER:
                      case KeyEvent.KEYCODE_NUMPAD_ENTER: cmd = "ok"; break;
                      case KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE:
                      case KeyEvent.KEYCODE_MEDIA_PLAY:
                      case KeyEvent.KEYCODE_MEDIA_PAUSE: cmd = "toggle"; isMedia = true; break;
                      case KeyEvent.KEYCODE_MEDIA_FAST_FORWARD: cmd = "right"; isMedia = true; break;
                      case KeyEvent.KEYCODE_MEDIA_REWIND: cmd = "left"; isMedia = true; break;
                      default: break;
                  }
                  if (cmd != null) {
                      if (e.getAction() == KeyEvent.ACTION_DOWN) {
                          if (isMedia) vid(cmd);
                          else press(cmd);
                      }
                      return true;
                  }
                  return super.dispatchKeyEvent(e);
              }

              private Button remoteButton(String label, final String cmd, final boolean repeat, int w, int h) {
                  Button b = new Button(this);
                  b.setText(label);
                  b.setAllCaps(false);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(14);
                  b.setPadding(0, 0, 0, 0);
                  b.setMinWidth(0);
                  b.setMinHeight(0);
                  b.setMinimumWidth(0);
                  b.setMinimumHeight(0);
                  b.setFocusable(false);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor("ok".equals(cmd) ? Color.argb(240, 30, 128, 255) : Color.argb(230, 44, 46, 60));
                  bg.setCornerRadius(dp(10));
                  bg.setStroke(dp(1), Color.argb(140, 255, 255, 255));
                  b.setBackground(bg);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(dp(w), dp(h));
                  lp.setMargins(dp(3), dp(3), dp(3), dp(3));
                  b.setLayoutParams(lp);
                  b.setOnTouchListener(new View.OnTouchListener() {
                      @Override
                      public boolean onTouch(final View v, MotionEvent ev) {
                          switch (ev.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  v.setAlpha(0.55f);
                                  press(cmd);
                                  if (repeat) {
                                      stopRepeat();
                                      repeater = new Runnable() {
                                          @Override public void run() {
                                              press(cmd);
                                              handler.postDelayed(this, 130);
                                          }
                                      };
                                      handler.postDelayed(repeater, 380);
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL:
                                  v.setAlpha(1f);
                                  stopRepeat();
                                  return true;
                          }
                          return true;
                      }
                  });
                  return b;
              }

              private void stopRepeat() {
                  if (repeater != null) handler.removeCallbacks(repeater);
                  repeater = null;
              }

              private LinearLayout row() {
                  LinearLayout r = new LinearLayout(this);
                  r.setOrientation(LinearLayout.HORIZONTAL);
                  r.setGravity(Gravity.CENTER);
                  return r;
              }

              private void attachDrag(View handle, final Runnable onTap) {
                  handle.setOnTouchListener(new View.OnTouchListener() {
                      float downX, downY, startTx, startTy;
                      boolean moved;
                      @Override
                      public boolean onTouch(View v, MotionEvent ev) {
                          switch (ev.getActionMasked()) {
                              case MotionEvent.ACTION_DOWN:
                                  downX = ev.getRawX();
                                  downY = ev.getRawY();
                                  startTx = remoteOverlay.getTranslationX();
                                  startTy = remoteOverlay.getTranslationY();
                                  moved = false;
                                  return true;
                              case MotionEvent.ACTION_MOVE:
                                  float dx = ev.getRawX() - downX;
                                  float dy = ev.getRawY() - downY;
                                  if (Math.hypot(dx, dy) > dp(6)) moved = true;
                                  if (moved) {
                                      setOverlayTranslation(startTx + dx, startTy + dy);
                                  }
                                  return true;
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL:
                                  if (!moved && onTap != null) onTap.run();
                                  return true;
                          }
                          return true;
                      }
                  });
              }

              private void setOverlayTranslation(float tx, float ty) {
                  if (frame.getWidth() == 0 || frame.getHeight() == 0) return;
                  float minTx = -remoteOverlay.getLeft();
                  float maxTx = frame.getWidth() - remoteOverlay.getRight();
                  float minTy = -remoteOverlay.getTop();
                  float maxTy = frame.getHeight() - remoteOverlay.getBottom();
                  if (minTx <= maxTx) tx = Math.max(minTx, Math.min(maxTx, tx));
                  if (minTy <= maxTy) ty = Math.max(minTy, Math.min(maxTy, ty));
                  remoteOverlay.setTranslationX(tx);
                  remoteOverlay.setTranslationY(ty);
              }

              private View buildPopupRemote() {
                  remoteOverlay = new FrameLayout(this);
                  remoteOverlay.setElevation(dp(32));

                  // Floating minimized pill (tap to pop open, drag anywhere)
                  remotePill = new TextView(this);
                  remotePill.setText("\uD83D\uDCFA Remote");
                  remotePill.setTextColor(Color.WHITE);
                  remotePill.setTextSize(13);
                  remotePill.setPadding(dp(14), dp(9), dp(14), dp(9));
                  GradientDrawable pillBg = new GradientDrawable();
                  pillBg.setColor(Color.argb(240, 22, 96, 210));
                  pillBg.setCornerRadius(dp(20));
                  pillBg.setStroke(dp(1), Color.argb(190, 255, 255, 255));
                  remotePill.setBackground(pillBg);
                  attachDrag(remotePill, new Runnable() {
                      @Override public void run() { setPopupOpen(true); }
                  });

                  // Floating expanded popup remote
                  remotePopup = new LinearLayout(this);
                  remotePopup.setOrientation(LinearLayout.VERTICAL);
                  remotePopup.setGravity(Gravity.CENTER_HORIZONTAL);
                  remotePopup.setPadding(dp(8), dp(8), dp(8), dp(8));
                  GradientDrawable popBg = new GradientDrawable();
                  popBg.setColor(Color.argb(232, 18, 20, 28));
                  popBg.setCornerRadius(dp(16));
                  popBg.setStroke(dp(1), Color.argb(140, 255, 255, 255));
                  remotePopup.setBackground(popBg);
                  attachDrag(remotePopup, null);

                  // Top bar (drag handle + touch lock toggle + minimize)
                  LinearLayout topBar = new LinearLayout(this);
                  topBar.setOrientation(LinearLayout.HORIZONTAL);
                  topBar.setGravity(Gravity.CENTER_VERTICAL);
                  LinearLayout.LayoutParams topLp = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.WRAP_CONTENT);
                  topLp.setMargins(0, 0, 0, dp(6));
                  topBar.setLayoutParams(topLp);

                  TextView dragTitle = new TextView(this);
                  dragTitle.setText("\uD83D\uDCFA Remote");
                  dragTitle.setTextColor(Color.WHITE);
                  dragTitle.setTextSize(12);
                  dragTitle.setPadding(dp(4), dp(2), dp(6), dp(2));
                  LinearLayout.LayoutParams titleLp = new LinearLayout.LayoutParams(
                          0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f);
                  dragTitle.setLayoutParams(titleLp);
                  attachDrag(dragTitle, null);

                  touchToggleBtn = new TextView(this);
                  touchToggleBtn.setTextColor(Color.WHITE);
                  touchToggleBtn.setTextSize(11);
                  touchToggleBtn.setPadding(dp(7), dp(4), dp(7), dp(4));
                  updateTouchToggleUi();
                  touchToggleBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) {
                          blockWebTouch = !blockWebTouch;
                          updateTouchToggleUi();
                      }
                  });

                  TextView closeBtn = new TextView(this);
                  closeBtn.setText("\u2715");
                  closeBtn.setTextColor(Color.WHITE);
                  closeBtn.setTextSize(13);
                  closeBtn.setPadding(dp(10), dp(3), dp(6), dp(3));
                  closeBtn.setOnClickListener(new View.OnClickListener() {
                      @Override public void onClick(View v) { setPopupOpen(false); }
                  });

                  topBar.addView(dragTitle);
                  topBar.addView(touchToggleBtn);
                  topBar.addView(closeBtn);

                  // D-pad + media/back buttons
                  LinearLayout r1 = row();
                  r1.addView(remoteButton("\u25B2", "up", true, 50, 42));
                  LinearLayout r2 = row();
                  r2.addView(remoteButton("\u25C0", "left", true, 50, 42));
                  r2.addView(remoteButton("OK", "ok", false, 52, 42));
                  r2.addView(remoteButton("\u25B6", "right", true, 50, 42));
                  LinearLayout r3 = row();
                  r3.addView(remoteButton("\u25BC", "down", true, 50, 42));
                  LinearLayout r4 = row();
                  r4.addView(remoteButton("\u21A9 Back", "back", false, 68, 36));
                  r4.addView(remoteButton("\u23EF", "toggle", false, 42, 36));
                  r4.addView(remoteButton("\u27F3", "reload", false, 42, 36));

                  remotePopup.addView(topBar);
                  remotePopup.addView(r1);
                  remotePopup.addView(r2);
                  remotePopup.addView(r3);
                  remotePopup.addView(r4);

                  remoteOverlay.addView(remotePopup, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT));
                  remoteOverlay.addView(remotePill, new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT));

                  boolean open = prefs.getBoolean("remote_open", true);
                  remotePopup.setVisibility(open ? View.VISIBLE : View.GONE);
                  remotePill.setVisibility(open ? View.GONE : View.VISIBLE);

                  FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.WRAP_CONTENT, FrameLayout.LayoutParams.WRAP_CONTENT);
                  lp.gravity = Gravity.CENTER_VERTICAL | Gravity.END;
                  lp.setMargins(dp(12), dp(12), dp(16), dp(12));
                  remoteOverlay.setLayoutParams(lp);
                  return remoteOverlay;
              }

              private void updateTouchToggleUi() {
                  GradientDrawable bg = new GradientDrawable();
                  bg.setCornerRadius(dp(8));
                  if (blockWebTouch) {
                      touchToggleBtn.setText("Touch: OFF");
                      bg.setColor(Color.argb(220, 185, 50, 50));
                  } else {
                      touchToggleBtn.setText("Touch: ON");
                      bg.setColor(Color.argb(220, 35, 145, 75));
                  }
                  touchToggleBtn.setBackground(bg);
              }

              private void setPopupOpen(boolean open) {
                  remotePopup.setVisibility(open ? View.VISIBLE : View.GONE);
                  remotePill.setVisibility(open ? View.GONE : View.VISIBLE);
                  prefs.edit().putBoolean("remote_open", open).apply();
                  remoteOverlay.post(new Runnable() {
                      @Override public void run() {
                          setOverlayTranslation(remoteOverlay.getTranslationX(), remoteOverlay.getTranslationY());
                      }
                  });
              }

              private String readAsset(String name) {
                  try {
                      InputStream in = getAssets().open(name);
                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      byte[] buf = new byte[4096];
                      int n;
                      while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                      in.close();
                      return bo.toString("UTF-8");
                  } catch (Exception e) {
                      Log.e(TAG, "asset error", e);
                      return "";
                  }
              }

              // ---------------- system UI helpers ----------------

              private void applyFullscreenSystemUi() {
                  getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              }

              private void exitCustomView() {
                  if (customView == null) return;
                  fullscreenContainer.removeView(customView);
                  fullscreenContainer.setVisibility(View.GONE);
                  content.setVisibility(View.VISIBLE);
                  if (remoteOverlay != null) remoteOverlay.bringToFront();
                  customView = null;
                  WebChromeClient.CustomViewCallback cb = customCallback;
                  customCallback = null;
                  if (cb != null) cb.onCustomViewHidden();
                  getWindow().clearFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  applyFullscreenSystemUi();
                  content.setPadding(padL, padT, padR, padB);
                  frame.requestApplyInsets();
                  web.requestFocus();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) applyFullscreenSystemUi();
              }

              // ---------------- block list ----------------

              private boolean parse(String json) {
                  try {
                      JSONObject o = new JSONObject(json);
                      Set<String> d = new HashSet<String>();
                      Set<String> u = new HashSet<String>();
                      JSONArray da = o.optJSONArray("blockDomains");
                      JSONArray ua = o.optJSONArray("blockUrls");
                      if (da != null) for (int i = 0; i < da.length(); i++)
                          d.add(da.getString(i).trim().toLowerCase(Locale.ROOT));
                      if (ua != null) for (int i = 0; i < ua.length(); i++)
                          u.add(endpointKey(ua.getString(i).trim()));
                      blockDomains.clear(); blockDomains.addAll(d);
                      blockUrls.clear();    blockUrls.addAll(u);
                      Log.d(TAG, "Block list loaded: " + d.size() + " domains, " + u.size() + " urls");
                      return true;
                  } catch (Exception e) {
                      Log.e(TAG, "parse error", e);
                      return false;
                  }
              }

              private static String stripSlash(String s) {
                  while (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  return s;
              }

              private boolean isBlocked(String url) {
                  try {
                      String host = Uri.parse(url).getHost();
                      if (host != null && blockDomains.contains(host.toLowerCase(Locale.ROOT))) {
                          return true;
                      }
                      if (blockUrls.contains(endpointKey(url))) {
                          return true;
                      }
                  } catch (Exception ignored) { }
                  return false;
              }

              private static String endpointKey(String url) {
                  Uri u = Uri.parse(url);
                  String host = u.getHost() == null ? "" : u.getHost().toLowerCase(Locale.ROOT);
                  String path = u.getPath() == null ? "" : u.getPath().toLowerCase(Locale.ROOT);
                  return host + stripSlash(path);
              }

              private String download(String link) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(link).openConnection();
                      c.setConnectTimeout(5000);
                      c.setReadTimeout(5000);
                      if (c.getResponseCode() != 200) return null;
                      BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line).append('\n');
                      r.close();
                      return sb.toString();
                  } catch (Exception e) {
                      Log.e(TAG, "download error", e);
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (customView != null) {
                      exitCustomView();
                  } else if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }

              @Override
              protected void onPause() {
                  super.onPause();
                  web.onPause();
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  web.onResume();
                  if (remoteOverlay != null) remoteOverlay.bringToFront();
              }
          }
          EOF

          # ---------- inject values ----------
          export PKG="$PACKAGE_NAME"
          for f in app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/$PKG_PATH/MainActivity.java; do
            perl -pi -e 's|__PKG__|$ENV{PKG}|g; s|__BASE_URL__|$ENV{BASE_URL}|g; s|__BLOCK_API__|$ENV{BLOCK_API}|g; s|__APP_NAME__|$ENV{APP_NAME}|g; s|__ICON_REF__|$ENV{ICON_REF}|g; s|__SHOW_REMOTE__|$ENV{SHOW_REMOTE}|g' "$f"
          done

      - name: Build debug APK
        working-directory: webapp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp webapp/app/build/outputs/apk/debug/app-debug.apk "out/webapp.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web-apk
          path: out/webapp.apk
          if-no-files-found: error
