name: Build Music8481 APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04 # Switching to 22.04 removes the annoying Node 20 deprecation warnings!
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Create Bubblewrap Config
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\": \"${JAVA_HOME}\", \"androidSdkPath\": \"${ANDROID_HOME}\"}" > ~/.bubblewrap/config.json

      - name: Generate Android Keystore (For App Signing)
        run: |
          keytool -genkey -v -keystore android.keystore -alias android -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=Music8481, OU=App, O=Music8481, C=IN"

      - name: Create TWA Manifest
        run: |
          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.music8481.app",
            "host": "ayushgaana.vercel.app",
            "name": "Music8481",
            "launcherName": "Music8481",
            "display": "standalone",
            "themeColor": "#000000",
            "navigationColor": "#000000",
            "backgroundColor": "#ffffff",
            "startUrl": "/",
            "iconUrl": "https://ui-avatars.com/api/?name=Music&background=1DB954&color=fff&size=512&format=png",
            "maskableIconUrl": "https://ui-avatars.com/api/?name=Music&background=1DB954&color=fff&size=512&format=png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "fallbackType": "customtabs"
          }
          EOF

      - name: Generate Android Project
        run: bubblewrap update 

      - name: Build APK
        env:
          # This securely auto-fills the passwords so the builder doesn't crash waiting for input
          BUBBLEWRAP_KEYSTORE_PASSWORD: password123
          BUBBLEWRAP_KEY_PASSWORD: password123
        run: bubblewrap build --skipPwaValidation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Music8481-APK
          path: app-release-signed.apk
