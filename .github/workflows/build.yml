name: Build Web APK

# =====================================================================
#  WebView APK builder
#  - Opens your website (BASE_URL) as the initial page inside the app
#  - Downloads a block list (Block.json) from GitHub at every app start
#    and blocks matching domains / URLs in all network requests
#    (cached locally so it also works when the list can't be fetched)
#  - Builds a debug APK (installable directly) and uploads it as artifact
#
#  HOW TO USE:
#   1. Save this file as  .github/workflows/build-apk.yml  in your repo
#   2. Edit the values in the "env" section below (or run manually from
#      the Actions tab -> "Run workflow" and type them there)
#   3. Download the APK from the run's "Artifacts" section
# =====================================================================

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base domain / initial URL (e.g. https://yourdomain.com)"
        required: false
      app_name:
        description: "App name"
        required: false
      package_name:
        description: "Package name (e.g. com.example.webapp)"
        required: false
  push:
    branches: [ main, master ]

permissions:
  contents: read

env:
  # ---------------------------------------------------------------
  # >>> PASTE YOUR BASE DOMAIN / INITIAL OPENING URL HERE <<<
  #     (must start with https:// or http://)
  # ---------------------------------------------------------------
  BASE_URL: ${{ github.event.inputs.base_url || 'https://hotstar.com' }}

  # >>> APP NAME shown on the phone <<<
  APP_NAME: ${{ github.event.inputs.app_name || 'Hotstar' }}

  # >>> PACKAGE NAME (unique id, lowercase, letters/dots only) <<<
  PACKAGE_NAME: ${{ github.event.inputs.package_name || 'com.ehotme.webapp' }}

  # >>> BLOCK LIST API (old URL, JSON with blockDomains + blockUrls) <<<
  BLOCK_API: 'https://raw.githubusercontent.com/Ayush8481-dev/Ayush/refs/heads/main/Block.json'

  # >>> OPTIONAL: direct link to a PNG icon (leave empty for default icon) <<<
  ICON_URL: 'https://static.vecteezy.com/system/resources/previews/056/505/637/non_2x/jiohotstar-app-icon-on-transparent-background-free-png.png'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Generate Android WebView project
        run: |
          set -e
          mkdir -p webapp && cd webapp
          PKG_PATH=$(echo "$PACKAGE_NAME" | tr . /)
          mkdir -p app/src/main/java/$PKG_PATH
          mkdir -p app/src/main/res/drawable

          # ---------- optional icon ----------
          if [ -n "$ICON_URL" ]; then
            curl -fsSL "$ICON_URL" -o app/src/main/res/drawable/ic_launcher.png
            export ICON_REF="@drawable/ic_launcher"
          else
            export ICON_REF="@android:drawable/sym_def_app_icon"
          fi

          # ---------- settings.gradle ----------
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WebApp"
          include ':app'
          EOF

          # ---------- root build.gradle ----------
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          # ---------- gradle.properties ----------
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF

          # ---------- app/build.gradle ----------
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace '__PKG__'
              compileSdk 34
              defaultConfig {
                  applicationId '__PKG__'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF

          # ---------- AndroidManifest.xml ----------
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application
                  android:label="__APP_NAME__"
                  android:icon="__ICON_REF__"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|smallestScreenSize|screenLayout">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # ---------- MainActivity.java ----------
          cat > app/src/main/java/$PKG_PATH/MainActivity.java <<'EOF'
          package __PKG__;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Log;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.ByteArrayInputStream;
          import java.io.BufferedReader;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.Collections;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;

          public class MainActivity extends Activity {

              // Injected by the GitHub workflow
              private static final String BASE_URL  = "__BASE_URL__";
              private static final String BLOCK_API = "__BLOCK_API__";
              private static final String TAG = "WebApp";

              private WebView web;
              private SharedPreferences prefs;
              private final Set<String> blockDomains = Collections.synchronizedSet(new HashSet<String>());
              private final Set<String> blockUrls = Collections.synchronizedSet(new HashSet<String>());

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  prefs = getSharedPreferences("blocklist", MODE_PRIVATE);

                  web = new WebView(this);
                  setContentView(web);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setLoadWithOverviewMode(true);
                  s.setUseWideViewPort(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);

                  web.setWebChromeClient(new WebChromeClient());
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (isBlocked(url)) {
                              Log.d(TAG, "BLOCKED: " + url);
                              return new WebResourceResponse("text/plain", "UTF-8", 403, "Blocked",
                                      new HashMap<String, String>(), new ByteArrayInputStream(new byte[0]));
                          }
                          return super.shouldInterceptRequest(view, request);
                      }

                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          String url = request.getUrl().toString();
                          if (isBlocked(url)) {
                              Log.d(TAG, "BLOCKED NAV: " + url);
                              return true;
                          }
                          String scheme = request.getUrl().getScheme();
                          if ("http".equals(scheme) || "https".equals(scheme)) {
                              return false; // stay inside the app
                          }
                          try { // tel:, mailto:, intent:, upi: etc.
                              startActivity(new Intent(Intent.ACTION_VIEW, request.getUrl()));
                          } catch (Exception ignored) { }
                          return true;
                      }
                  });

                  // 1) load cached block list (if any)
                  String cached = prefs.getString("json", null);
                  final boolean hadCache = cached != null && parse(cached);

                  // 2) open the site right away if we already have a list
                  if (hadCache) web.loadUrl(BASE_URL);

                  // 3) fetch fresh list in background (first run: wait for it, then open site)
                  new Thread(new Runnable() {
                      @Override
                      public void run() {
                          String json = download(BLOCK_API);
                          if (json != null && parse(json)) {
                              prefs.edit().putString("json", json).apply();
                          }
                          if (!hadCache) {
                              runOnUiThread(new Runnable() {
                                  @Override public void run() { web.loadUrl(BASE_URL); }
                              });
                          }
                      }
                  }).start();
              }

              private boolean parse(String json) {
                  try {
                      JSONObject o = new JSONObject(json);
                      Set<String> d = new HashSet<String>();
                      Set<String> u = new HashSet<String>();
                      JSONArray da = o.optJSONArray("blockDomains");
                      JSONArray ua = o.optJSONArray("blockUrls");
                      if (da != null) for (int i = 0; i < da.length(); i++)
                          d.add(da.getString(i).trim().toLowerCase(Locale.ROOT));
                      if (ua != null) for (int i = 0; i < ua.length(); i++)
                          u.add(endpointKey(ua.getString(i).trim()));
                      blockDomains.clear(); blockDomains.addAll(d);
                      blockUrls.clear();    blockUrls.addAll(u);
                      Log.d(TAG, "Block list loaded: " + d.size() + " domains, " + u.size() + " urls");
                      return true;
                  } catch (Exception e) {
                      Log.e(TAG, "parse error", e);
                      return false;
                  }
              }

              private static String stripSlash(String s) {
                  while (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  return s;
              }

              private boolean isBlocked(String url) {
                  try {
                      String host = Uri.parse(url).getHost();
                      // 1) blockDomains: EXACT host match only (no subdomains)
                      if (host != null && blockDomains.contains(host.toLowerCase(Locale.ROOT))) {
                          return true;
                      }
                      // 2) blockUrls: EXACT endpoint only (host + path; query/#hash ignored,
                      //    other paths on the same domain are NOT blocked)
                      if (blockUrls.contains(endpointKey(url))) {
                          return true;
                      }
                  } catch (Exception ignored) { }
                  return false;
              }

              // "https://Google.com/search/?q=x#a" -> "google.com/search"
              private static String endpointKey(String url) {
                  Uri u = Uri.parse(url);
                  String host = u.getHost() == null ? "" : u.getHost().toLowerCase(Locale.ROOT);
                  String path = u.getPath() == null ? "" : u.getPath().toLowerCase(Locale.ROOT);
                  return host + stripSlash(path);
              }

              private String download(String link) {
                  HttpURLConnection c = null;
                  try {
                      c = (HttpURLConnection) new URL(link).openConnection();
                      c.setConnectTimeout(5000);
                      c.setReadTimeout(5000);
                      if (c.getResponseCode() != 200) return null;
                      BufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream(), "UTF-8"));
                      StringBuilder sb = new StringBuilder();
                      String line;
                      while ((line = r.readLine()) != null) sb.append(line).append('\n');
                      r.close();
                      return sb.toString();
                  } catch (Exception e) {
                      Log.e(TAG, "download error", e);
                      return null;
                  } finally {
                      if (c != null) c.disconnect();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }
          }
          EOF

          # ---------- inject values (perl keeps special chars like & safe) ----------
          export PKG="$PACKAGE_NAME"
          for f in app/build.gradle app/src/main/AndroidManifest.xml app/src/main/java/$PKG_PATH/MainActivity.java; do
            perl -pi -e 's/__PKG__/$ENV{PKG}/g; s/__BASE_URL__/$ENV{BASE_URL}/g; s/__BLOCK_API__/$ENV{BLOCK_API}/g; s/__APP_NAME__/$ENV{APP_NAME}/g; s/__ICON_REF__/$ENV{ICON_REF}/g' "$f"
          done

      - name: Build debug APK
        working-directory: webapp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp webapp/app/build/outputs/apk/debug/app-debug.apk "out/webapp.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: web-apk
          path: out/webapp.apk
          if-no-files-found: error
