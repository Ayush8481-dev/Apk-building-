name: Build APK

# Single-file workflow: it writes the whole Android project during the run,
# builds a debug APK and uploads it as an artifact. Nothing else is needed in the repo.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK (accept licenses, install platform 34)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Generate project files
        run: |
          mkdir -p app/src/main/java/com/example/keysniffer app/src/main/assets
          cat > settings.gradle <<'KS_EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "KeySniffer"
          include ':app'
          KS_EOF
          cat > build.gradle <<'KS_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          KS_EOF
          cat > gradle.properties <<'KS_EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          KS_EOF
          cat > app/build.gradle <<'KS_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.keysniffer'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.example.keysniffer'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.webkit:webkit:1.11.0'
          }
          KS_EOF
          cat > app/src/main/AndroidManifest.xml <<'KS_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:label="Key Sniffer"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          KS_EOF
          cat > app/src/main/assets/hook.js <<'KS_EOF'
          // Injected at document start. Hooks client-side decryption and reports
          // Key / IV / output to the native app through the KH bridge.
          (function () {
            if (window.__kh) return;
            window.__kh = true;

            var _btoa = window.btoa.bind(window);
            var _atob = window.atob.bind(window);

            function send(o) {
              try { KH.report(JSON.stringify(o)); } catch (e) {}
            }

            function toBytes(x) {
              try {
                if (x == null) return null;
                if (x instanceof ArrayBuffer) return new Uint8Array(x.slice(0));
                if (ArrayBuffer.isView(x)) {
                  return new Uint8Array(x.buffer.slice(x.byteOffset, x.byteOffset + x.byteLength));
                }
              } catch (e) {}
              return null;
            }

            function hex(u) {
              var s = '';
              for (var i = 0; i < u.length; i++) s += ('0' + u[i].toString(16)).slice(-2);
              return s;
            }

            function b64(u) {
              var s = '';
              for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]);
              return _btoa(s);
            }

            function utf8(u) {
              try { return new TextDecoder('utf-8', { fatal: true }).decode(u); } catch (e) { return null; }
            }

            function describe(u) {
              if (!u) return null;
              var t = utf8(u);
              if (t !== null && !/^[\x20-\x7e]*$/.test(t)) t = null; // only show readable text
              return { len: u.length, hex: hex(u), b64: b64(u), utf8: t };
            }

            function preview(s) {
              if (s == null) return null;
              s = String(s);
              return s.length > 400 ? s.slice(0, 400) + '…(' + s.length + ' chars)' : s;
            }

            // Heartbeat: proves the script ran in this frame and the native bridge works.
            var where = '';
            try { where = (window.top === window ? 'top ' : 'frame ') + location.href; } catch (e) { where = 'frame'; }
            send({ src: 'hook', op: 'active', alg: '', out: preview(where) });

            /* ---------------- WebCrypto (crypto.subtle) ---------------- */
            if (window.SubtleCrypto && SubtleCrypto.prototype) {
              var P = SubtleCrypto.prototype;
              var keyMap = new WeakMap();
              var oImport = P.importKey;
              var oExport = P.exportKey;

              P.importKey = function (format, keyData) {
                var p = oImport.apply(this, arguments);
                var raw = null, jwk = null;
                if (format === 'raw') raw = toBytes(keyData);
                else if (format === 'jwk') { try { jwk = JSON.stringify(keyData); } catch (e) {} }
                return p.then(function (k) {
                  keyMap.set(k, { raw: raw, jwk: jwk });
                  return k;
                });
              };

              P.exportKey = function (format) {
                var p = oExport.apply(this, arguments);
                p.then(function (r) {
                  var u = toBytes(r);
                  if (u) send({ src: 'WebCrypto', op: 'exportKey(' + format + ')', alg: '', key: describe(u) });
                }, function () {});
                return p;
              };

              var keyInfo = function (self, key) {
                var m = keyMap.get(key);
                if (m && m.raw) return Promise.resolve({ key: describe(m.raw) });
                if (m && m.jwk) return Promise.resolve({ note: 'JWK key: ' + m.jwk });
                return oExport.call(self, 'raw', key).then(
                  function (r) { return { key: describe(toBytes(r)) }; },
                  function () { return { note: 'key is non-extractable (derived/generated)' }; }
                );
              };

              ['encrypt', 'decrypt'].forEach(function (op) {
                var orig = P[op];
                P[op] = function (algo, key, data) {
                  var self = this;
                  var result = orig.apply(this, arguments);
                  var a = algo || {};
                  var iv = toBytes(a.iv) || toBytes(a.counter);
                  var aad = toBytes(a.additionalData);
                  Promise.all([
                    keyInfo(self, key),
                    result.then(function (r) { return r; }, function () { return null; })
                  ]).then(function (res) {
                    var ki = res[0], out = res[1];
                    var msg = {
                      src: 'WebCrypto',
                      op: op,
                      alg: typeof algo === 'string' ? algo : (a.name || ''),
                      key: ki.key || null,
                      iv: describe(iv),
                      aad: describe(aad),
                      note: ki.note || null
                    };
                    var ob = toBytes(out);
                    if (ob) {
                      msg.out = op === 'decrypt' ? preview(utf8(ob) || ('(binary ' + ob.length + ' bytes) ' + hex(ob).slice(0, 120))) : ('(' + ob.length + ' bytes)');
                    } else if (out === null) {
                      msg.out = '(operation failed — wrong key/IV?)';
                    }
                    send(msg);
                  });
                  return result;
                };
              });
            }

            /* ---------------- CryptoJS (global OR bundled) ---------------- */
            function wa(C, x) {
              if (x == null) return null;
              if (typeof x === 'string') return { len: x.length, utf8: x, note: 'string' };
              if (x.words && typeof x.toString === 'function') {
                var o = { len: x.sigBytes };
                try { o.hex = x.toString(C.enc.Hex); } catch (e) {}
                try { o.b64 = x.toString(C.enc.Base64); } catch (e) {}
                try {
                  var t = x.toString(C.enc.Utf8);
                  if (/^[\x20-\x7e]*$/.test(t)) o.utf8 = t; // only show readable text
                } catch (e) {}
                return o;
              }
              return null;
            }

            var CJS_NAMES = ['AES', 'DES', 'TripleDES', 'RC4', 'RC4Drop', 'Rabbit'];

            // Wrap encrypt/decrypt of ONE cipher helper (e.g. CryptoJS.AES).
            function hookCipher(C, name, c) {
              if (!c || (typeof c !== 'object' && typeof c !== 'function') || c.__khc) return;
              try { Object.defineProperty(c, '__khc', { value: 1 }); } catch (e) { return; }
              ['encrypt', 'decrypt'].forEach(function (op) {
                var orig = c[op];
                if (typeof orig !== 'function') return;
                c[op] = function (msg, key, cfg) {
                  var r = orig.apply(this, arguments);
                  try {
                    var out;
                    try { out = op === 'decrypt' ? r.toString(C.enc.Utf8) : String(r); }
                    catch (e) { out = '(non-UTF8 output)'; }
                    var k = wa(C, key);
                    var note = null;
                    if (k && k.note === 'string') {
                      note = 'Key is a passphrase string. If no IV is given, CryptoJS derives the real key+IV (EVP_BytesToKey/MD5) from this passphrase and the salt stored in the ciphertext.';
                    }
                    send({
                      src: 'CryptoJS',
                      op: op,
                      alg: name,
                      key: k,
                      iv: wa(C, cfg && cfg.iv),
                      note: note,
                      out: preview(out)
                    });
                  } catch (e) {}
                  return r;
                };
              });
            }

            function hookCJS(C) {
              if (!C || !C.enc) return;
              CJS_NAMES.forEach(function (n) { if (C[n]) hookCipher(C, n, C[n]); });
            }

            // 1) Library exposed as window.CryptoJS
            var _cj = window.CryptoJS;
            try {
              Object.defineProperty(window, 'CryptoJS', {
                configurable: true,
                enumerable: true,
                get: function () { return _cj; },
                set: function (v) { _cj = v; try { hookCJS(v); } catch (e) {} }
              });
            } catch (e) {}
            if (_cj) { try { hookCJS(_cj); } catch (e) {} }
            setInterval(function () { try { hookCJS(window.CryptoJS); } catch (e) {} }, 500);

            // 2) Library BUNDLED (webpack/vite) and not on window: crypto-js runs
            //    `C.AES = ...` on a plain object. An accessor on Object.prototype makes
            //    that assignment call us, so we get the object and can wrap it.
            CJS_NAMES.forEach(function (name) {
              try {
                Object.defineProperty(Object.prototype, name, {
                  configurable: true,
                  enumerable: false,
                  get: function () { return undefined; },
                  set: function (v) {
                    try {
                      Object.defineProperty(this, name, {
                        value: v, writable: true, configurable: true, enumerable: true
                      });
                    } catch (e) {}
                    try { if (this && this.enc && v) hookCipher(this, name, v); } catch (e) {}
                  }
                });
              } catch (e) {}
            });

            /* ---------------- Base64 image URLs (atob) ---------------- */
            var seen = {};
            window.atob = function (s) {
              var r = _atob(s);
              try {
                if (/^https?:\/\//i.test(r) && !seen[r]) {
                  seen[r] = 1;
                  send({ src: 'atob', op: 'base64 decode', alg: 'base64', out: preview(r) });
                }
              } catch (e) {}
              return r;
            };

            /* ---------------- Blob images created after decrypting ---------------- */
            if (window.URL && URL.createObjectURL) {
              var oCOU = URL.createObjectURL;
              var blobCount = 0;
              URL.createObjectURL = function (obj) {
                var u = oCOU.apply(this, arguments);
                try {
                  if (blobCount++ < 30) {
                    send({
                      src: 'blob', op: 'createObjectURL', alg: '',
                      out: ((obj && obj.type) || 'blob') + ' ' + ((obj && obj.size) || 0) + ' bytes -> ' + u
                    });
                  }
                } catch (e) {}
                return u;
              };
            }
          })();
          KS_EOF
          cat > app/src/main/java/com/example/keysniffer/MainActivity.java <<'KS_EOF'
          package com.example.keysniffer;

          import android.app.Activity;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.graphics.Bitmap;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Bundle;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.inputmethod.EditorInfo;
          import android.view.inputmethod.InputMethodManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;

          import androidx.webkit.WebViewCompat;
          import androidx.webkit.WebViewFeature;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.util.Collections;

          public class MainActivity extends Activity {

              private WebView web;
              private EditText urlBox;
              private TextView log;
              private ScrollView scroll;
              private String hookJs = "";
              private boolean docStartInjected = false;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  hookJs = readAsset("hook.js");
                  buildUi();
                  setupWebView();
                  go("https://example.com");
              }

              /* ---------------------------- UI ---------------------------- */

              private int dp(int v) {
                  return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, v,
                          getResources().getDisplayMetrics());
              }

              private void buildUi() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);

                  // URL bar
                  LinearLayout bar = new LinearLayout(this);
                  bar.setOrientation(LinearLayout.HORIZONTAL);
                  bar.setGravity(Gravity.CENTER_VERTICAL);
                  bar.setPadding(dp(6), dp(30), dp(6), dp(4));

                  urlBox = new EditText(this);
                  urlBox.setSingleLine(true);
                  urlBox.setHint("Enter URL or search");
                  urlBox.setTextSize(14);
                  urlBox.setImeOptions(EditorInfo.IME_ACTION_GO);
                  urlBox.setOnEditorActionListener((v, actionId, event) -> {
                      if (actionId == EditorInfo.IME_ACTION_GO
                              || (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER)) {
                          go(urlBox.getText().toString());
                          return true;
                      }
                      return false;
                  });
                  bar.addView(urlBox, new LinearLayout.LayoutParams(0,
                          LinearLayout.LayoutParams.WRAP_CONTENT, 1f));

                  Button goBtn = new Button(this);
                  goBtn.setText("Go");
                  goBtn.setOnClickListener(v -> go(urlBox.getText().toString()));
                  bar.addView(goBtn);
                  root.addView(bar);

                  // WebView
                  web = new WebView(this);
                  root.addView(web, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f));

                  // Buttons for the log
                  LinearLayout btns = new LinearLayout(this);
                  btns.setOrientation(LinearLayout.HORIZONTAL);
                  Button copy = new Button(this);
                  copy.setText("Copy log");
                  copy.setOnClickListener(v -> {
                      ClipboardManager cm = (ClipboardManager) getSystemService(Context.CLIPBOARD_SERVICE);
                      cm.setPrimaryClip(ClipData.newPlainText("keys", log.getText()));
                      Toast.makeText(this, "Copied", Toast.LENGTH_SHORT).show();
                  });
                  Button clear = new Button(this);
                  clear.setText("Clear");
                  clear.setOnClickListener(v -> log.setText(""));
                  btns.addView(copy, new LinearLayout.LayoutParams(0,
                          LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  btns.addView(clear, new LinearLayout.LayoutParams(0,
                          LinearLayout.LayoutParams.WRAP_CONTENT, 1f));
                  root.addView(btns);

                  // Log panel
                  scroll = new ScrollView(this);
                  scroll.setBackgroundColor(Color.parseColor("#111111"));
                  log = new TextView(this);
                  log.setTextColor(Color.parseColor("#7CFC9A"));
                  log.setTypeface(Typeface.MONOSPACE);
                  log.setTextSize(11);
                  log.setPadding(dp(8), dp(8), dp(8), dp(8));
                  log.setTextIsSelectable(true);
                  log.setText("Waiting for the page to decrypt something…\n");
                  scroll.addView(log);
                  root.addView(scroll, new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(230)));

                  setContentView(root);
              }

              /* -------------------------- WebView -------------------------- */

              private void setupWebView() {
                  WebView.setWebContentsDebuggingEnabled(true);

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_COMPATIBILITY_MODE);
                  s.setUseWideViewPort(true);
                  s.setLoadWithOverviewMode(true);

                  web.addJavascriptInterface(new Bridge(), "KH");

                  if (WebViewFeature.isFeatureSupported(WebViewFeature.DOCUMENT_START_SCRIPT)) {
                      WebViewCompat.addDocumentStartJavaScript(web, hookJs, Collections.singleton("*"));
                      docStartInjected = true;
                  }

                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public void onPageFinished(WebView view, String url) {
                          // Diagnostic: is the hook present, and is the bridge visible to the page?
                          view.evaluateJavascript(
                                  "(window.__kh ? 'HOOK_OK' : 'HOOK_MISSING') + ' bridge=' + (typeof KH)",
                                  value -> {
                                      String v = value == null ? "" : value.replace("\"", "");
                                      append("[page loaded] " + v + "  docStart=" + docStartInjected);
                                      if (v.startsWith("HOOK_MISSING")) {
                                          view.evaluateJavascript(hookJs, null); // late injection
                                      }
                                  });
                      }

                      @Override
                      public void onPageStarted(WebView view, String url, Bitmap favicon) {
                          if (!docStartInjected) {
                              view.evaluateJavascript(hookJs, null); // fallback, may run late
                          }
                          urlBox.setText(url);
                      }
                  });
              }

              private void go(String input) {
                  String u = input == null ? "" : input.trim();
                  if (u.isEmpty()) return;
                  if (!u.matches("^[a-zA-Z][a-zA-Z0-9+.-]*://.*")) {
                      if (u.contains(" ") || !u.contains(".")) {
                          u = "https://www.google.com/search?q=" + android.net.Uri.encode(u);
                      } else {
                          u = "https://" + u;
                      }
                  }
                  web.loadUrl(u);
                  InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                  if (imm != null) imm.hideSoftInputFromWindow(urlBox.getWindowToken(), 0);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) web.goBack();
                  else super.onBackPressed();
              }

              /* ----------------------- JS -> native ----------------------- */

              private class Bridge {
                  @JavascriptInterface
                  public void report(final String json) {
                      runOnUiThread(() -> append(format(json)));
                  }
              }

              private void append(String text) {
                  log.append(text + "\n");
                  scroll.post(() -> scroll.fullScroll(ScrollView.FOCUS_DOWN));
              }

              private String format(String json) {
                  try {
                      JSONObject o = new JSONObject(json);
                      StringBuilder sb = new StringBuilder();
                      sb.append("▶ ").append(o.optString("src")).append("  ")
                              .append(o.optString("alg")).append("  ")
                              .append(o.optString("op")).append('\n');
                      field(sb, "KEY", o.optJSONObject("key"));
                      field(sb, "IV ", o.optJSONObject("iv"));
                      field(sb, "AAD", o.optJSONObject("aad"));
                      String note = o.optString("note", "");
                      if (!note.isEmpty() && !"null".equals(note)) sb.append("NOTE: ").append(note).append('\n');
                      String out = o.optString("out", "");
                      if (!out.isEmpty() && !"null".equals(out)) sb.append("OUT: ").append(out).append('\n');
                      sb.append("────────────────────");
                      return sb.toString();
                  } catch (Exception e) {
                      return "(unparsed) " + json;
                  }
              }

              private void field(StringBuilder sb, String label, JSONObject f) {
                  if (f == null) return;
                  String len = f.has("len") ? " (" + f.optInt("len") + " bytes)" : "";
                  sb.append(label).append(len).append('\n');
                  String hex = f.optString("hex", "");
                  String b64 = f.optString("b64", "");
                  String txt = f.optString("utf8", "");
                  if (!hex.isEmpty()) sb.append("  hex : ").append(hex).append('\n');
                  if (!b64.isEmpty()) sb.append("  b64 : ").append(b64).append('\n');
                  if (!txt.isEmpty() && !"null".equals(txt)) sb.append("  text: ").append(txt).append('\n');
              }

              private String readAsset(String name) {
                  try (InputStream in = getAssets().open(name)) {
                      ByteArrayOutputStream bos = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0) bos.write(buf, 0, n);
                      return bos.toString("UTF-8");
                  } catch (Exception e) {
                      return "";
                  }
              }
          }
          KS_EOF

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KeySniffer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
